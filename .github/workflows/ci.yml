name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Check formatting
        id: format
        run: bun run format:check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Format"
            echo "- Result: \`${{ steps.format.outcome }}\`"
            echo "- Command: \`bun run format:check\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  licence-headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check licence headers
        id: headers
        run: bash scripts/check-headers.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Licence headers"
            echo "- Result: \`${{ steps.headers.outcome }}\`"
            echo "- Command: \`bash scripts/check-headers.sh\`"
          } >> "${GITHUB_STEP_SUMMARY}"
