name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Check formatting
        id: format
        run: bun run format:check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Format"
            echo "- Result: \`${{ steps.format.outcome }}\`"
            echo "- Command: \`bun run format:check\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  licence-headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check licence headers
        id: headers
        run: bash scripts/check-headers.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Licence headers"
            echo "- Result: \`${{ steps.headers.outcome }}\`"
            echo "- Command: \`bash scripts/check-headers.sh\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  plugin-boundaries:
    name: Plugin boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check plugin boundaries
        id: boundaries
        run: bash scripts/check-plugin-boundaries.sh

      # Two modules that differ only by case are one file on Windows and macOS (A11).
      - name: Check module names for case collisions
        id: case
        run: bash scripts/check-case-collisions.sh

      # The operations engine reaches the file system only through a `Provider` (A46).
      - name: Check the operations engine's sandbox
        id: ops_sandbox
        run: bash scripts/check-ops-sandbox.sh

      # Every native plugin the app registers is in the Services panel (A66).
      - name: Check the Services panel covers every plugin
        id: services
        run: bash scripts/check-services.sh

      # The logical-CSS check below is a Bun script over the workspace.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Layout uses logical properties so it mirrors under right-to-left languages (A68).
      - name: Check stylesheets use logical properties
        id: logical_css
        run: bash scripts/check-logical-css.sh

      # The translation check reads the app's modules and runs Prettier; Bun is set up above.
      # The translation files and catalogues agree with English (A68).
      - name: Check translations are in step with English
        id: i18n
        run: bash scripts/check-i18n.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Plugin boundaries"
            echo "- Result: \`${{ steps.boundaries.outcome }}\`"
            echo "- Command: \`bash scripts/check-plugin-boundaries.sh\`"
            echo "- Rule: JavaScript reaches native plugins only through their \`guest-js\` APIs"
            echo "- Case collisions: \`${{ steps.case.outcome }}\` (\`bash scripts/check-case-collisions.sh\`)"
            echo "- Operations sandbox: \`${{ steps.ops_sandbox.outcome }}\` (\`bash scripts/check-ops-sandbox.sh\`)"
            echo "- Services panel: \`${{ steps.services.outcome }}\` (\`bash scripts/check-services.sh\`)"
            echo "- Logical CSS: \`${{ steps.logical_css.outcome }}\` (\`bash scripts/check-logical-css.sh\`)"
            echo "- Translations: \`${{ steps.i18n.outcome }}\` (\`bash scripts/check-i18n.sh\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Type-check
        id: typecheck
        run: bun run typecheck

      - name: Run tests
        id: tests
        run: bun run test:js:ci

      - name: Build
        id: build
        run: bun run build

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend tests"
            echo "| Step | Result | Command |"
            echo "|---|---|---|"
            echo "| Type-check | \`${{ steps.typecheck.outcome }}\` | \`bun run typecheck\` |"
            echo "| Tests | \`${{ steps.tests.outcome }}\` | \`bun run test:js:ci\` |"
            echo "| Build | \`${{ steps.build.outcome }}\` | \`bun run build\` |"
            echo
            bash scripts/junit-summary.sh test-results/chrome-junit.xml test-results/junit.xml
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload frontend test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: test-results/*.xml
          if-no-files-found: error

      # Consumed by publish-test-results.yml — the pull_request event's own
      # GITHUB_TOKEN is read-only for Dependabot and fork PRs, so publishing
      # the JUnit check run has to happen from a separate `workflow_run`
      # workflow instead, which runs with this repo's own permissions
      # regardless of who opened the PR.
      - name: Upload event file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  rust-tests:
    name: ${{ matrix.arch == 'x64' && 'Rust tests' || format('Rust tests ({0})', matrix.arch) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    container:
      image: ghcr.io/liminal-hq/tauri-ci-desktop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Trust the GitHub workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The Tauri build script needs the built frontend (`frontendDist`).
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: Swatinem/rust-cache@v2

      # Formatting and the generated bindings do not depend on the architecture, so x64 checks them.
      - name: Check formatting
        id: fmt
        if: matrix.arch == 'x64'
        run: cargo fmt --all -- --check

      - name: Lint
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: Run tests
        id: nextest
        run: cargo nextest run --workspace --profile ci

      # Snapshots every generated directory (the protocol crate and each plugin), deletes them so a
      # removed type cannot leave a stale file behind, regenerates with `cargo test`, and diffs. It
      # runs after the tests so the test build is reused and nothing compiles twice.
      - name: Check generated bindings for drift
        id: drift
        if: matrix.arch == 'x64'
        run: bash scripts/check-bindings-drift.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Rust tests (${{ matrix.arch }})"
            echo "| Step | Result | Command |"
            echo "|---|---|---|"
            echo "| Format | \`${{ steps.fmt.outcome }}\` | \`cargo fmt --all -- --check\` |"
            echo "| Clippy | \`${{ steps.clippy.outcome }}\` | \`cargo clippy --workspace --all-targets -- -D warnings\` |"
            echo "| Tests | \`${{ steps.nextest.outcome }}\` | \`cargo nextest run --workspace --profile ci\` |"
            echo "| Bindings drift | \`${{ steps.drift.outcome }}\` | \`bash scripts/check-bindings-drift.sh\` (fix a failure with \`bun run bindings\` and commit the regenerated files) |"
            echo
            bash scripts/junit-summary.sh target/nextest/ci/junit.xml
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Rust test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch == 'x64' && 'rust-test-results' || format('rust-test-results-{0}', matrix.arch) }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

  # The remote providers against real servers (A85). OpenSSH's `sshd` runs as the runner's user
  # with keys the tests generate (no root, no container), Samba's `smbd` the same way with a private
  # state directory and the runner's own account, and Apache's `httpd` (with `mod_dav`) and `rclone
  # serve webdav` on loopback ports as the runner's user; `WAYPOINT_SFTP_REQUIRE`,
  # `WAYPOINT_SMB_REQUIRE` and `WAYPOINT_WEBDAV_REQUIRE` make a missing server a failure here, where
  # elsewhere the same tests skip. The archive provider needs no server, but its tests read archives
  # made by the real `tar`, `zip` and `7z` tools (encrypted ones included); `WAYPOINT_ARCHIVE_REQUIRE`
  # makes a missing tool a failure here.
  # The Git provider needs no server either, but its tests build repositories with the real `git` (never
  # run by the provider itself), and `WAYPOINT_GIT_REQUIRE` makes a missing `git` a failure here.
  remote-conformance:
    name: Remote providers against real servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the servers and the archivers
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends openssh-server samba apache2 rclone zip p7zip-full zstd xz-utils bzip2
          # The packages start system daemons (Samba on port 445, Apache on port 80) that the tests do not
          # use; the tests run their own, as the runner's user.
          sudo systemctl disable --now smbd nmbd winbind apache2 2>/dev/null || true
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # One run, so one JUnit file holds every provider's tests.
      - name: Run the SFTP provider against sshd and the WebDAV provider against Apache and rclone
        id: providers
        env:
          WAYPOINT_SFTP_REQUIRE: '1'
          WAYPOINT_WEBDAV_REQUIRE: '1'
        run: cargo nextest run --profile ci -p waypoint-provider-sftp -p openssh-config -p waypoint-provider-webdav

      - name: Run the SMB provider against smbd
        id: smb
        env:
          WAYPOINT_SMB_REQUIRE: '1'
        run: cargo nextest run --profile ci -p waypoint-provider-smb
      - name: Run the S3 provider against rclone
        id: s3
        env:
          WAYPOINT_S3_REQUIRE: '1'
        run: cargo nextest run --profile ci -p waypoint-provider-s3
      - name: Run the archive provider against the real archivers
        id: archive
        env:
          WAYPOINT_ARCHIVE_REQUIRE: '1'
        run: cargo nextest run --profile ci -p waypoint-provider-archive
      - name: Run the Git provider against repositories made by the real `git`
        id: git
        env:
          WAYPOINT_GIT_REQUIRE: '1'
        run: cargo nextest run --profile ci -p waypoint-provider-git

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Remote providers against real servers"
            echo "| Step | Result | Command |"
            echo "|---|---|---|"
            echo "| SFTP and WebDAV | \`${{ steps.providers.outcome }}\` | \`cargo nextest run --profile ci -p waypoint-provider-sftp -p openssh-config -p waypoint-provider-webdav\` |"
            echo "| SMB | \`${{ steps.smb.outcome }}\` | \`cargo nextest run --profile ci -p waypoint-provider-smb\` |"
            echo "| S3 | \`${{ steps.s3.outcome }}\` | \`cargo nextest run --profile ci -p waypoint-provider-s3\` |"
            echo "| Archives | \`${{ steps.archive.outcome }}\` | \`cargo nextest run --profile ci -p waypoint-provider-archive\` |"
            echo "| Git | \`${{ steps.git.outcome }}\` | \`cargo nextest run --profile ci -p waypoint-provider-git\` |"
            echo
            bash scripts/junit-summary.sh target/nextest/ci/junit.xml
          } >> "${GITHUB_STEP_SUMMARY}"

  # Windows 11 is a real target (A11): the whole workspace must keep compiling and linting there, and
  # the pure crates' tests, including path rules, run on Windows. Linting and testing are separate
  # jobs so they build in parallel, and the tests run on nextest, which runs every test binary at once
  # (`cargo test` runs them one after another).
  windows-lint:
    name: ${{ matrix.arch == 'x64' && 'Windows lint' || format('Windows lint ({0})', matrix.arch) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.arch == 'arm64'
      # The Tauri build script needs the built frontend (`frontendDist`).
      - run: bun install --frozen-lockfile
      # `bun run build` runs `tsc` first, so a module-name collision that only a case-insensitive file
      # system sees (`TabMenus.tsx` beside `tabMenus.ts`) fails here, before Cargo embeds a stale `dist`.
      - run: bun run build
      - uses: Swatinem/rust-cache@v2

      - name: Lint
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows lint (${{ matrix.arch }})"
            echo "| Step | Result | Command |"
            echo "|---|---|---|"
            echo "| Clippy | \`${{ steps.clippy.outcome }}\` | \`cargo clippy --workspace --all-targets -- -D warnings\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  windows-tests:
    name: ${{ matrix.arch == 'x64' && 'Windows tests' || format('Windows tests ({0})', matrix.arch) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.arch == 'arm64'
      # The crates under test do not embed the frontend, so there is nothing to build first.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # The time-format plugin's mock-runtime test needs the Common Controls manifest, which a test
      # binary lacks on Windows, so only its unit tests run here: the filter drops the integration
      # test binaries of the plugins listed in it (add a plugin to the list when it joins this job).
      - name: Test the pure crates and the plugins' unit tests
        id: tests
        run: >-
          cargo nextest run --no-fail-fast
          -p waypoint-protocol -p waypoint-session -p waypoint-vfs -p waypoint-settings -p waypoint-ops -p waypoint-provider-archive -p tauri-plugin-window-tearoff -p tauri-plugin-os-prefs -p tauri-plugin-trash -p tauri-plugin-thumbnails -p tauri-plugin-volumes -p tauri-plugin-secrets -p tauri-plugin-window-effects -p tauri-plugin-mime-apps -p tauri-plugin-native-dnd -p tauri-plugin-waypoint-ops -p tauri-plugin-waypoint-settings
          -E "not (kind(test) & (package(tauri-plugin-os-prefs) | package(tauri-plugin-trash) | package(tauri-plugin-thumbnails) | package(tauri-plugin-volumes) | package(tauri-plugin-secrets) | package(tauri-plugin-window-effects) | package(tauri-plugin-mime-apps) | package(tauri-plugin-native-dnd) | package(tauri-plugin-waypoint-ops) | package(tauri-plugin-waypoint-settings)))"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows tests (${{ matrix.arch }})"
            echo "| Step | Result | Command |"
            echo "|---|---|---|"
            echo "| Pure crate tests | \`${{ steps.tests.outcome }}\` | \`cargo nextest run --no-fail-fast -p waypoint-protocol -p waypoint-session -p waypoint-vfs -p waypoint-settings -p waypoint-ops -p waypoint-provider-archive -p tauri-plugin-window-tearoff -p tauri-plugin-os-prefs -p tauri-plugin-trash -p tauri-plugin-thumbnails -p tauri-plugin-native-dnd -p tauri-plugin-waypoint-ops -p tauri-plugin-waypoint-settings -E \"not (kind(test) & (package(tauri-plugin-os-prefs) | package(tauri-plugin-trash) | package(tauri-plugin-thumbnails) | package(tauri-plugin-volumes) | package(tauri-plugin-window-effects) | package(tauri-plugin-mime-apps) | package(tauri-plugin-native-dnd) | package(tauri-plugin-waypoint-ops) | package(tauri-plugin-waypoint-settings)))\"\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
