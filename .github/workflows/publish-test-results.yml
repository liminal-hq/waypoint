name: Publish Test Results

# Split out from `ci.yml` because the `pull_request` event's own
# `GITHUB_TOKEN` is downgraded to read-only for Dependabot and fork PRs —
# `EnricoMi/publish-unit-test-result-action` needs `checks: write` to create
# its check run, which that token can never grant no matter what this
# workflow requests. A `workflow_run` trigger always runs with this
# workflow file's own permissions, from the default branch, regardless of
# who or what opened the originating PR.

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions: {}

jobs:
  publish-test-results:
    name: Publish test results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Download and extract artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd artifacts
          gh api "${{ github.event.workflow_run.artifacts_url }}" -q '.artifacts[] | [.name, .archive_download_url] | @tsv' |
            while IFS=$'\t' read -r name url; do
              gh api "${url}" > "${name}.zip"
              unzip -d "${name}" "${name}.zip"
            done

      - name: Publish frontend test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Waypoint frontend tests
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/frontend-test-results/**/*.xml

      - name: Publish Rust test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Waypoint Rust tests
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/rust-test-results*/**/*.xml
