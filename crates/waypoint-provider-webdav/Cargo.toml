[package]
name = "waypoint-provider-webdav"
version = "0.1.0"
description = "Waypoint's WebDAV provider: dav:// and davs:// servers over reqwest, with a Nextcloud preset"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
futures = "0.3"
httpdate = "1"
log = { workspace = true }
md-5 = "0.10"
percent-encoding = "2"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "stream", "system-proxy"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
waypoint-path = { path = "../waypoint-path" }
waypoint-protocol = { path = "../waypoint-protocol" }
waypoint-vfs = { path = "../waypoint-vfs" }
x509-parser = "0.18"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
waypoint-vfs = { path = "../waypoint-vfs", features = ["testing"] }
