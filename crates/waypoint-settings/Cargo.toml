[package]
name = "waypoint-settings"
version = "0.1.0"
description = "Waypoint's application settings: the typed document, its validation, and the versioned storage with a previous generation and recovery"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }
# Pure Rust: deflate through `flate2` over `zlib-rs` (already in the lock), no C library, so it builds for Windows and arm64 as it is. Reading and writing only; no encryption or other codecs.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
