[package]
name = "waypoint-provider-smb"
version = "0.1.0"
description = "Waypoint's SMB provider: smb:// shares through smb2 on Linux, and the share browser over the OS on Windows"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[features]
# The pure Rust SMB 2/3 client (spike #278). On by default; Windows serves shares through the
# operating system's own client and does not use it.
default = ["client"]
client = ["dep:smb2", "dep:tokio"]

[dependencies]
log = { workspace = true }
waypoint-path = { path = "../waypoint-path" }
waypoint-protocol = { path = "../waypoint-protocol" }
waypoint-vfs = { path = "../waypoint-vfs" }

[target.'cfg(not(windows))'.dependencies]
futures = "0.3"
smb2 = { version = "=0.27.0", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WNet", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
waypoint-vfs = { path = "../waypoint-vfs", features = ["testing"] }
