[default]
description = "Default permissions for the secrets plugin: report its status, and store, test for and delete secrets. Reading a secret back into the webview (`allow-fetch`) is deliberately not part of it: grant it only to a window that has to show or use a secret"
permissions = [
  "allow-get-status",
  "allow-store",
  "allow-exists",
  "allow-delete",
  "allow-delete-account",
]
