[package]
name = "tauri-plugin-secrets"
version = "0.1.0"
description = "Tauri plugin for secrets: store, fetch and delete passwords, passphrases and tokens in the system keyring (Secret Service and the Secret portal on Linux, Credential Manager on Windows)"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"
links = "tauri-plugin-secrets"
keywords = ["tauri", "plugin", "secrets", "keyring", "secret-service"]
categories = ["api-bindings", "authentication"]

[package.metadata.platforms.support]
windows = { level = "partial", notes = "Generic credentials in Credential Manager (`CredWriteW`, `CredReadW`, `CredDeleteW`, `CredEnumerateW`), named by the app identifier; type-checked with `cargo xwin` but not yet exercised on a Windows 11 machine. A secret is at most 2560 bytes" }
linux = { level = "full", notes = "Talks to the Secret Service (`org.freedesktop.secrets`: GNOME Keyring, KWallet through its bridge) over the session bus and, inside a Flatpak, to the Secret portal, through `oo7`; reports a typed reason when no keyring runs or it stays locked" }
macos = { level = "none", notes = "Reports every feature unavailable" }
android = { level = "none", notes = "Desktop only" }
ios = { level = "none", notes = "Desktop only" }

[lib]
name = "tauri_plugin_secrets"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
log = { workspace = true }
ts-rs = "12"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# `native_crypto` keeps OpenSSL out of the build; `tokio` matches Tauri's runtime.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

# Matches the version Tauri resolves, so the types line up.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
