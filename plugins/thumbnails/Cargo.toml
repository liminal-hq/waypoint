[package]
name = "tauri-plugin-thumbnails"
version = "0.1.0"
description = "Tauri plugin for thumbnails: the freedesktop.org thumbnail cache, a built-in image generator, external thumbnailers and the Windows shell, behind a cancellable queue and a cache-key-only URI scheme"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"
links = "tauri-plugin-thumbnails"
keywords = ["tauri", "plugin", "thumbnails", "freedesktop", "thumbnailer"]
categories = ["api-bindings", "filesystem", "multimedia::images"]

[package.metadata.platforms.support]
windows = { level = "partial", notes = "Asks the shell for thumbnails through IShellItemImageFactory on single-threaded-apartment worker threads and never downloads a cloud placeholder; cross-checked with `cargo xwin` and exercised in a Windows 11 virtual machine through the plugin's ignored `live_shell_thumbnail` test" }
linux = { level = "full", notes = "Reads and writes the freedesktop.org thumbnail cache, so thumbnails are shared with Nemo, Nautilus and Dolphin; generates with the built-in image decoders or an installed *.thumbnailer" }
macos = { level = "none", notes = "Reports every feature unavailable" }
android = { level = "none", notes = "Desktop only" }
ios = { level = "none", notes = "Desktop only" }

[lib]
name = "tauri_plugin_thumbnails"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ts-rs = "12"
md-5 = "0.10"
percent-encoding = "2"
lru = "0.18"
# Only the decoders the built-in generator uses; no default features.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
# Writes and reads the PNG `tEXt` chunks the cache standard needs; the version `image` resolves.
png = "0.18"
fast_image_resize = "5"
# Decodes a JPEG at a reduced scale (1/2, 1/4 or 1/8) so a large photo is never decoded in full.
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Matches the version Tauri resolves, so the types line up.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "3"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
