[package]
name = "tauri-plugin-waypoint-vfs"
version = "0.1.0"
description = "Waypoint's file system plugin: listing handles, range fetch and places, over the waypoint-vfs crate"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
publish = false
build = "build.rs"
links = "tauri-plugin-waypoint-vfs"

[package.metadata.platforms.support]
linux = { level = "full", notes = "Local listings with inotify watching, places from XDG user directories and GTK bookmarks" }
windows = { level = "partial", notes = "Builds and is checked for the Windows target in CI; not yet run on Windows 11" }

[lib]
name = "tauri_plugin_waypoint_vfs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = "2"
thiserror = { workspace = true }
waypoint-connections = { path = "../../crates/waypoint-connections" }
waypoint-path = { path = "../../crates/waypoint-path" }
waypoint-protocol = { path = "../../crates/waypoint-protocol" }
waypoint-vfs = { path = "../../crates/waypoint-vfs" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
# The elevated provider and its loopback launcher, for the commands that reach the one `admin:` login.
waypoint-elevated = { path = "../../crates/waypoint-elevated", features = ["testing"] }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tempfile = "3"
waypoint-vfs = { path = "../../crates/waypoint-vfs", features = ["testing"] }
