[default]
description = "Default permissions for the waypoint-vfs plugin"
permissions = [
  "allow-get-status",
  "allow-get-trash-info",
  "allow-open-listing",
  "allow-get-range",
  "allow-set-sort",
  "allow-set-filter",
  "allow-close-listing",
  "allow-refresh-listing",
  "allow-get-home",
  "allow-parse-location",
  "allow-parse-location-text",
  "allow-describe-location",
  "allow-entry-location",
  "allow-summarise-selection",
  "allow-get-free-space",
  "allow-check-folder",
  "allow-open-entry",
  "allow-entry-details",
  "allow-folder-size",
  "allow-cancel-folder-size",
  "allow-scan-dir-sizes",
  "allow-cancel-dir-scan",
  "allow-get-cached-dir-scan",
  "allow-read-text-head",
  "allow-list-places",
  "allow-add-favourite",
  "allow-remove-favourite",
  "allow-rename-favourite",
  "allow-move-favourite",
]

[[set]]
identifier = "connections"
description = "The saved connections and the connection manager, for the main windows: read, add, change, copy, reorder and forget saved connections and recent servers, read a typed server address, list the SSH hosts to suggest, connect, cancel a connect that is waiting on the system's prompt, test, disconnect and read a login's state, and forget a remembered login. A secret is sent to Rust inside an answer and never read back"
permissions = [
  "allow-list-connections",
  "allow-connection-support",
  "allow-suggested-servers",
  "allow-parse-address-text",
  "allow-add-connection",
  "allow-update-connection",
  "allow-duplicate-connection",
  "allow-remove-connection",
  "allow-move-connection",
  "allow-forget-recent-server",
  "allow-forget-login",
  "allow-connect",
  "allow-cancel-connect",
  "allow-test-connection",
  "allow-disconnect",
  "allow-connection-state",
]
