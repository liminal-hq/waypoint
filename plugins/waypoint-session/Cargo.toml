[package]
name = "tauri-plugin-waypoint-session"
version = "0.1.0"
description = "Waypoint's session plugin: every window's tabs, groups, pairs, view and geometry in one store, over the waypoint-session crate"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
publish = false
build = "build.rs"
links = "tauri-plugin-waypoint-session"

[package.metadata.platforms.support]
linux = { level = "full", notes = "Nothing platform-specific; the state is in memory, and windows are created by the injected factory" }
windows = { level = "full", notes = "Nothing platform-specific; the state is in memory, and windows are created by the injected factory" }

[lib]
name = "tauri_plugin_waypoint_session"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
waypoint-protocol = { path = "../../crates/waypoint-protocol" }
waypoint-session = { path = "../../crates/waypoint-session" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
serde_json = { workspace = true }
tauri = { workspace = true, features = ["test"] }
