[package]
name = "tauri-plugin-waypoint-session"
version = "0.1.0"
description = "Waypoint's session plugin: tabs, their order, the active tab and per-tab history for each window, over the waypoint-session crate"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
publish = false
build = "build.rs"
links = "tauri-plugin-waypoint-session"

[package.metadata.platforms.support]
linux = { level = "full", notes = "Nothing platform-specific; the state is in memory" }
windows = { level = "full", notes = "Nothing platform-specific; the state is in memory" }

[lib]
name = "tauri_plugin_waypoint_session"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
waypoint-protocol = { path = "../../crates/waypoint-protocol" }
waypoint-session = { path = "../../crates/waypoint-session" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
