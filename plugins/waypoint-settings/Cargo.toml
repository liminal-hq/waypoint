[package]
name = "tauri-plugin-waypoint-settings"
version = "0.1.0"
description = "Waypoint's settings plugin: the application settings in one place, saved by the app, with a change event to every window, over the waypoint-settings crate"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
publish = false
build = "build.rs"
links = "tauri-plugin-waypoint-settings"

[package.metadata.platforms.support]
linux = { level = "full", notes = "Nothing platform-specific; the document is saved through the storage the app injects" }
windows = { level = "partial", notes = "Builds and is checked for the Windows target in CI; the mock-runtime tests run there too (the build script embeds the Common Controls manifest the test binary needs)" }

[lib]
name = "tauri_plugin_waypoint_settings"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
waypoint-protocol = { path = "../../crates/waypoint-protocol" }
waypoint-settings = { path = "../../crates/waypoint-settings" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile = "3"
tauri = { workspace = true, features = ["test"] }
waypoint-session = { path = "../../crates/waypoint-session" }
