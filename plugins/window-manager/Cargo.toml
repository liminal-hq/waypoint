[package]
name = "tauri-plugin-window-manager"
version = "0.1.0"
description = "Tauri plugin that reaches window manager features a webview cannot, such as the compositor's own window menu"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"
links = "tauri-plugin-window-manager"

[package.metadata.platforms.support]
windows = { level = "partial", notes = "Shows the Windows system menu through GetSystemMenu and TrackPopupMenu; type-checked but not yet run on Windows" }
linux = { level = "full", notes = "Asks the compositor to show its window menu on Wayland and X11 through GDK" }
macos = { level = "partial", notes = "Pops up the application's Window menu at the pointer; type-checked but not yet run on macOS" }
android = { level = "none", notes = "Desktop window managers only" }
ios = { level = "none", notes = "Desktop window managers only" }

[lib]
name = "tauri_plugin_window_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
log = { workspace = true }
ts-rs = "12"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = "0.18"

# Matches the version Tauri resolves, so the window handle types line up.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# The same versions Tauri resolves.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
