[package]
name = "tauri-plugin-system-appearance"
version = "0.1.0"
description = "Tauri plugin that reads the operating system's window titlebar and appearance preferences and pushes changes"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"
links = "tauri-plugin-system-appearance"

[package.metadata.platforms.support]
windows = { level = "partial", notes = "Reports the fixed Windows titlebar layout and actions, and reads the appearance preferences through UISettings, AccessibilitySettings and the registry and the colour palette through UISettings, the registry and GetSysColor; type-checked for Windows but not yet run there, except the title bar colour, which has been neither compiled nor run on Windows" }
linux = { level = "full", notes = "Reads xdg-desktop-portal, kwinrc, kdeglobals, gsettings or xfconf depending on the desktop environment, and the colour palette from kdeglobals or the GTK theme, and watches for changes" }
macos = { level = "partial", notes = "Reports the fixed macOS traffic-light layout and the double-click action from NSGlobalDomain, and reports every appearance preference and every palette colour as unavailable; changes are not pushed" }
android = { level = "none", notes = "Desktop window titlebars only" }
ios = { level = "none", notes = "Desktop window titlebars only" }

[lib]
name = "tauri_plugin_system_appearance"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
log = { workspace = true }
ts-rs = "12"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "settings"] }
futures-util = "0.3"
gtk = "0.18"
notify = "8"

# Matches the version Tauri resolves.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "UI",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_WinRT",
] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
