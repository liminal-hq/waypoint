[package]
name = "tauri-plugin-system-appearance"
version = "0.1.0"
description = "Tauri plugin that reads the operating system's window titlebar preferences and pushes changes"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"
links = "tauri-plugin-system-appearance"

[package.metadata.platforms.support]
windows = { level = "full", notes = "Reports the fixed Windows titlebar layout and actions" }
linux = { level = "full", notes = "Reads xdg-desktop-portal, kwinrc, gsettings or xfconf depending on the desktop environment, and watches for changes" }
macos = { level = "partial", notes = "Reports the fixed macOS traffic-light layout and the double-click action from NSGlobalDomain; changes are not pushed" }
android = { level = "none", notes = "Desktop window titlebars only" }
ios = { level = "none", notes = "Desktop window titlebars only" }

[lib]
name = "tauri_plugin_system_appearance"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
log = { workspace = true }
ts-rs = "12"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
futures-util = "0.3"
notify = "8"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
