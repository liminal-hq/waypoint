[global]
  ncalrpc dir = /tmp/claude-1000/spike-remote/smbd/run
  winbindd socket directory = /tmp/claude-1000/spike-remote/smbd/run
  nmbd:socket dir = /tmp/claude-1000/spike-remote/smbd/run
  workgroup = WORKGROUP
  server min protocol = SMB2
  smb ports = 4445
  interfaces = lo
  bind interfaces only = yes
  private dir = /tmp/claude-1000/spike-remote/smbd/priv
  lock directory = /tmp/claude-1000/spike-remote/smbd/lock
  state directory = /tmp/claude-1000/spike-remote/smbd/state
  cache directory = /tmp/claude-1000/spike-remote/smbd/cache
  pid directory = /tmp/claude-1000/spike-remote/smbd/run
  passdb backend = tdbsam:/tmp/claude-1000/spike-remote/smbd/priv/passdb.tdb
  security = user
  map to guest = never
  log file = /tmp/claude-1000/spike-remote/smbd/log.%m
  disable netbios = yes
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  ntlm auth = ntlmv2-only
[data]
  path = /tmp/claude-1000/spike-remote/data
  read only = yes
  valid users = scott
