[package]
name = "waypoint"
version = "0.0.1"
description = "A tabbed, extensible file manager"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
name = "waypoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["sftp", "smb", "webdav", "s3", "git", "archive"]
# One feature per remote provider (A85), so a build can leave a heavy protocol library out.
sftp = ["dep:waypoint-provider-sftp", "dep:openssh-config"]
smb = ["dep:waypoint-provider-smb"]
webdav = ["dep:waypoint-provider-webdav"]
s3 = ["dep:waypoint-provider-s3"]
# The `git+file` revision provider; the Git status plugin is always there (it reads no revision).
git = []
archive = ["dep:waypoint-provider-archive"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
# The menu library `tauri` builds its menus with, named here only to set the size menu icons are
# drawn at (`native_menu`). It must stay the same version as `tauri`'s so there is one copy, and the
# workspace patches it to a fork that adds that setting (remove with the patch).
muda = { version = "0.20", default-features = false }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
# The system file dialogs, used from Rust only (the settings export and import).
tauri-plugin-dialog = "2"
tauri-plugin-os-prefs = { path = "../../../plugins/os-prefs" }
tauri-plugin-system-appearance = { path = "../../../plugins/system-appearance" }
tauri-plugin-window-effects = { path = "../../../plugins/window-effects" }
tauri-plugin-window-manager = { path = "../../../plugins/window-manager" }
tauri-plugin-native-dnd = { path = "../../../plugins/native-dnd" }
tauri-plugin-window-tearoff = { path = "../../../plugins/window-tearoff" }
tauri-plugin-trash = { path = "../../../plugins/trash" }
tauri-plugin-thumbnails = { path = "../../../plugins/thumbnails" }
tauri-plugin-volumes = { path = "../../../plugins/volumes" }
tauri-plugin-secrets = { path = "../../../plugins/secrets" }
tauri-plugin-mime-apps = { path = "../../../plugins/mime-apps" }
tauri-plugin-opener = "2"
# Remembers where the Settings and Properties dialogs were left (A134); the other windows keep their own geometry.
tauri-plugin-window-state = "2"
# The shared portal and desktop-integration plugins (liminal-hq/tauri-plugins-workspace#80), used only
# from Rust (A65). Pinned to the exact revision that PR's head had; move the `rev` to the release or
# merge commit that carries them once it exists.
tauri-plugin-xdg-portal = { git = "https://github.com/liminal-hq/tauri-plugins-workspace.git", rev = "1e03c1f7eb3481236e11fd247de3785e04f674aa" }
tauri-plugin-desktop-integration = { git = "https://github.com/liminal-hq/tauri-plugins-workspace.git", rev = "1e03c1f7eb3481236e11fd247de3785e04f674aa" }
tokio = { workspace = true, features = ["time"] }
tauri-plugin-waypoint-vfs = { path = "../../../plugins/waypoint-vfs" }
tauri-plugin-waypoint-session = { path = "../../../plugins/waypoint-session" }
tauri-plugin-waypoint-ops = { path = "../../../plugins/waypoint-ops" }
tauri-plugin-waypoint-settings = { path = "../../../plugins/waypoint-settings" }
tauri-plugin-waypoint-git = { path = "../../../plugins/waypoint-git" }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
chrono = "0.4"
waypoint-connections = { path = "../../../crates/waypoint-connections" }
waypoint-ops = { path = "../../../crates/waypoint-ops" }
waypoint-path = { path = "../../../crates/waypoint-path" }
waypoint-provider-git = { path = "../../../crates/waypoint-provider-git" }
waypoint-protocol = { path = "../../../crates/waypoint-protocol" }
waypoint-session = { path = "../../../crates/waypoint-session" }
waypoint-settings = { path = "../../../crates/waypoint-settings" }
waypoint-vfs = { path = "../../../crates/waypoint-vfs" }
waypoint-provider-sftp = { path = "../../../crates/waypoint-provider-sftp", optional = true }
waypoint-provider-smb = { path = "../../../crates/waypoint-provider-smb", optional = true }
waypoint-provider-webdav = { path = "../../../crates/waypoint-provider-webdav", optional = true }
waypoint-provider-s3 = { path = "../../../crates/waypoint-provider-s3", optional = true }
waypoint-provider-archive = { path = "../../../crates/waypoint-provider-archive", optional = true }
openssh-config = { path = "../../../crates/openssh-config", optional = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile = "3"
# The fake remote provider, for the tests of the protocol gate and of remote thumbnails.
waypoint-vfs = { path = "../../../crates/waypoint-vfs", features = ["testing"] }

# Debug-only automation bridge, registered under `#[cfg(all(debug_assertions, not(windows)))]` in
# `src/lib.rs`. It must be a normal dependency (dev-dependencies are not available to the lib
# target) even though release builds never activate it. It is left out on Windows: 0.13.0 depends on
# `webview2-com` 0.38 while Tauri 2.12 uses 0.39, so the two do not compile together there. Drop the
# `cfg` once a bridge release matches Tauri's `windows` crate.
# The X11 global shortcut path of `desktop-integration` registers through this plugin, which the app
# must register itself; Windows has its own hotkey thread.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-mcp-bridge = "0.13"
