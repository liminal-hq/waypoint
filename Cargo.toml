[workspace]
members = ["crates/waypoint-protocol", "apps/waypoint/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/liminal-hq/waypoint"
repository = "https://github.com/liminal-hq/waypoint"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tauri = { version = "2" }
tauri-build = { version = "2" }

[profile.release]
strip = true
