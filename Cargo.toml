[workspace]
members = [
  "crates/waypoint-path",
  "crates/waypoint-ops",
  "crates/waypoint-protocol",
  "crates/waypoint-session",
  "crates/waypoint-settings",
  "crates/waypoint-vfs",
  "crates/waypoint-provider-sftp",
  "crates/waypoint-provider-smb",
  "crates/waypoint-provider-archive",
  "crates/openssh-config",
  "crates/wayland-toplevel-drag",
  "apps/waypoint/src-tauri",
  "plugins/native-dnd",
  "plugins/os-prefs",
  "plugins/system-appearance",
  "plugins/secrets",
  "plugins/thumbnails",
  "plugins/trash",
  "plugins/volumes",
  "plugins/window-effects",
  "plugins/mime-apps",
  "plugins/window-manager",
  "plugins/window-tearoff",
  "plugins/waypoint-ops",
  "plugins/waypoint-session",
  "plugins/waypoint-settings",
  "plugins/waypoint-vfs",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
rust-version = "1.93.0"
homepage = "https://github.com/liminal-hq/waypoint"
repository = "https://github.com/liminal-hq/waypoint"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin = { version = "2" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
log = "0.4"

[profile.release]
strip = true
