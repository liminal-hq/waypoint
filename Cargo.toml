[workspace]
members = [
  "crates/waypoint-path",
  "crates/waypoint-ops",
  "crates/waypoint-protocol",
  "crates/waypoint-session",
  "crates/waypoint-settings",
  "crates/waypoint-vfs",
  "crates/waypoint-provider-sftp",
  "crates/waypoint-provider-s3",
  "crates/waypoint-provider-smb",
  "crates/waypoint-provider-archive",
  "crates/waypoint-connections",
  "crates/waypoint-elevated",
  "crates/waypoint-elevate-helper",
  "crates/waypoint-provider-git",
  "crates/waypoint-provider-webdav",
  "crates/openssh-config",
  "crates/wayland-toplevel-drag",
  "apps/waypoint/src-tauri",
  "plugins/elevate",
  "plugins/native-dnd",
  "plugins/os-prefs",
  "plugins/system-appearance",
  "plugins/secrets",
  "plugins/thumbnails",
  "plugins/trash",
  "plugins/volumes",
  "plugins/window-effects",
  "plugins/mime-apps",
  "plugins/window-manager",
  "plugins/window-tearoff",
  "plugins/waypoint-ops",
  "plugins/waypoint-session",
  "plugins/waypoint-settings",
  "plugins/waypoint-git",
  "plugins/waypoint-vfs",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
rust-version = "1.93.0"
homepage = "https://github.com/liminal-hq/waypoint"
repository = "https://github.com/liminal-hq/waypoint"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin = { version = "2" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
log = "0.4"

# `muda` is the menu library under `tauri::menu`. The fork adds what experimental native context menus
# need (D196, A146): a size for menu icons that follows the screen's scale (GTK 3 forces 16 pixels,
# Windows draws the bitmap as it is) and, for GTK 3, a style hook. Its changes are additive; drop this
# patch, and the `muda` dependency of `apps/waypoint/src-tauri`, once they are in a published release.
[patch.crates-io]
muda = { git = "https://github.com/ScottMorris/tauri-muda", rev = "fb022414cef5b657c5295dbf6057c426390d11cf" }

[profile.release]
strip = true
