<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Waypoint</title>
  <desc id="hero-desc">A tabbed, extensible file manager. An animated banner shows a tab being torn off a window into a window of its own, and a folder springing open under a dragged file.</desc>

  <style>
    .display { font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .ui { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d0b"/>
      <stop offset="100%" stop-color="#211611"/>
    </linearGradient>

    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <clipPath id="frame-clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Ambient ember glows -->
    <g opacity="0.10">
      <circle cx="930" cy="150" r="210" fill="#f97316"/>
      <circle cx="140" cy="60" r="150" fill="#c2410c"/>
    </g>

    <!-- Faint waypoint route across the banner: dots joined by a dashed line -->
    <g opacity="0.22" stroke="#f97316" stroke-width="1.2" fill="none">
      <path d="M40 282 C 240 262, 360 300, 560 272" stroke-dasharray="3 7"/>
    </g>
    <g fill="#f97316" opacity="0.5">
      <circle cx="40" cy="282" r="3.5"/>
      <circle cx="300" cy="284" r="2.5"/>
      <circle cx="560" cy="272" r="3.5"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(64, 0)">
      <text class="display" x="0" y="140" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#ember)" filter="url(#glow)">Waypoint</text>
      <text class="display" x="2" y="184" font-size="22" font-weight="500" fill="#f5efe9">A tabbed, extensible file manager</text>
      <text class="ui" x="2" y="214" font-size="15" fill="#a89e95">Tear-off tabs · split views · super drag and drop</text>

      <!-- Stack chips -->
      <g class="ui" font-size="12.5" font-weight="600" fill="#f5efe9">
        <rect x="2" y="238" width="86" height="26" rx="13" fill="#2a2420" stroke="#3d342e"/>
        <text x="45" y="255.5" text-anchor="middle">Tauri v2</text>
        <rect x="98" y="238" width="70" height="26" rx="13" fill="#2a2420" stroke="#3d342e"/>
        <text x="133" y="255.5" text-anchor="middle">React</text>
        <rect x="178" y="238" width="62" height="26" rx="13" fill="#2a2420" stroke="#3d342e"/>
        <text x="209" y="255.5" text-anchor="middle">Rust</text>
        <rect x="250" y="238" width="132" height="26" rx="13" fill="#2a2420" stroke="#3d342e"/>
        <text x="316" y="255.5" text-anchor="middle">Linux · Windows 11</text>
      </g>
    </g>

    <!-- The window -->
    <g transform="translate(560, 56) scale(0.88)" filter="url(#shadow)">
      <rect width="500" height="232" rx="12" fill="url(#window)" stroke="#3d342e"/>

      <!-- Title bar -->
      <path d="M0 12a12 12 0 0 1 12-12h476a12 12 0 0 1 12 12v22H0z" fill="#292420"/>
      <text class="ui" x="250" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#d8cfc7">Waypoint — Projects</text>
      <g fill="none" stroke="#a89e95" stroke-width="1.4" stroke-linecap="round">
        <path d="M436 17h10"/>
        <rect x="456" y="12" width="9" height="9" rx="1.5"/>
        <path d="M478 12l9 9M487 12l-9 9"/>
      </g>

      <!-- Tab strip -->
      <line x1="0" y1="62" x2="500" y2="62" stroke="#3d342e"/>
      <g class="ui" font-size="11.5" font-weight="500">
        <!-- Home -->
        <g>
          <rect x="10" y="38" width="88" height="24" rx="7" fill="#2f2823"/>
          <text x="54" y="54" text-anchor="middle" fill="#d8cfc7">Home</text>
        </g>
        <!-- Projects (active) -->
        <g>
          <rect x="104" y="38" width="112" height="24" rx="7" fill="#3a2c22" stroke="#f97316" stroke-opacity="0.6"/>
          <rect x="112" y="48" width="14" height="4" rx="1" fill="#f97316"/>
          <text x="166" y="54" text-anchor="middle" fill="#fff4ea">Projects</text>
        </g>
        <!-- Downloads: the tab that gets torn off -->
        <g>
          <rect x="222" y="38" width="112" height="24" rx="7" fill="#2f2823">
            <animate class="motion" attributeName="opacity" dur="8s" repeatCount="indefinite"
              values="1;1;0.3;0.3;1;1" keyTimes="0;0.5;0.58;0.88;0.95;1"/>
          </rect>
          <text x="278" y="54" text-anchor="middle" fill="#d8cfc7">
            Downloads
            <animate class="motion" attributeName="opacity" dur="8s" repeatCount="indefinite"
              values="1;1;0.3;0.3;1;1" keyTimes="0;0.5;0.58;0.88;0.95;1"/>
          </text>
        </g>
        <!-- Remote -->
        <g>
          <rect x="340" y="38" width="112" height="24" rx="7" fill="#2f2823"/>
          <circle cx="352" cy="50" r="3" fill="#4ade80"/>
          <text x="404" y="54" text-anchor="middle" fill="#d8cfc7">homelab</text>
        </g>
        <!-- New tab -->
        <g stroke="#a89e95" stroke-width="1.4" stroke-linecap="round">
          <path d="M470 50h10M475 45v10"/>
        </g>
      </g>

      <!-- Path bar -->
      <rect x="10" y="72" width="480" height="22" rx="6" fill="#211c19"/>
      <g class="ui" font-size="11" fill="#a89e95">
        <text x="20" y="87">~</text>
        <text x="34" y="87">›</text>
        <text x="46" y="87" fill="#f5efe9">Projects</text>
        <text x="98" y="87">›</text>
        <text x="110" y="87" fill="#f5efe9">waypoint</text>
      </g>

      <!-- Sidebar -->
      <rect x="0" y="102" width="112" height="130" fill="#1e1a17"/>
      <g class="ui" font-size="11" fill="#a89e95">
        <text x="14" y="122" fill="#6f655d" font-size="9.5" font-weight="700" letter-spacing="1">PLACES</text>
        <text x="14" y="142" fill="#d8cfc7">Home</text>
        <text x="14" y="160" fill="#d8cfc7">Documents</text>
        <text x="14" y="178" fill="#d8cfc7">Downloads</text>
        <text x="14" y="204" fill="#6f655d" font-size="9.5" font-weight="700" letter-spacing="1">NETWORK</text>
      </g>

      <!-- File rows -->
      <g class="ui" font-size="11.5">
        <rect x="120" y="106" width="372" height="26" rx="6" fill="#2d2119"/>
        <rect x="128" y="113" width="14" height="12" rx="2" fill="#f97316" opacity="0.9"/>
        <text x="150" y="123" fill="#fff4ea">src</text>
        <text x="330" y="123" fill="#a89e95">12 items</text>

        <rect x="128" y="141" width="14" height="12" rx="2" fill="#f97316" opacity="0.55"/>
        <text x="150" y="151" fill="#d8cfc7">docs</text>
        <text x="330" y="151" fill="#a89e95">17 items</text>

        <rect x="128" y="169" width="14" height="12" rx="2" fill="#f97316" opacity="0.55"/>
        <text x="150" y="179" fill="#d8cfc7">crates</text>
        <text x="330" y="179" fill="#a89e95">4 items</text>

        <rect x="128" y="197" width="12" height="14" rx="2" fill="#a89e95" opacity="0.5"/>
        <text x="150" y="207" fill="#d8cfc7">SPEC.md</text>
        <text x="330" y="207" fill="#a89e95">31 KB</text>
      </g>

      <!-- Spring-load ring around the folder being hovered by a drag -->
      <rect x="120" y="139" width="372" height="28" rx="7" fill="none" stroke="#f97316" stroke-width="1.6"
        stroke-dasharray="820" stroke-dashoffset="820" opacity="0.9">
        <animate class="motion" attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite"
          values="820;820;0;0;820;820" keyTimes="0;0.04;0.2;0.42;0.44;1"/>
        <animate class="motion" attributeName="opacity" dur="8s" repeatCount="indefinite"
          values="0;0.9;0.9;0;0" keyTimes="0;0.04;0.42;0.44;1"/>
      </rect>

      <!-- Dragged file stack: a small badge that follows a path onto the folder -->
      <g class="motion">
        <g opacity="0">
          <rect x="0" y="0" width="60" height="22" rx="6" fill="#f97316"/>
          <text class="ui" x="30" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1917">3 files</text>
          <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
            values="380 214;380 214;250 146;250 146;250 146" keyTimes="0;0.02;0.18;0.42;1"/>
          <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
            values="0;1;1;0;0" keyTimes="0;0.03;0.42;0.45;1"/>
        </g>
      </g>
    </g>

    <!-- Torn-off ghost: a mini window that leaves the strip and drifts free -->
    <g class="motion">
      <g opacity="0">
        <g filter="url(#shadow)">
          <rect width="170" height="104" rx="9" fill="#2a2420" stroke="#f97316" stroke-opacity="0.7"/>
          <path d="M0 9a9 9 0 0 1 9-9h152a9 9 0 0 1 9 9v16H0z" fill="#3a2c22"/>
          <text class="ui" x="85" y="16.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff4ea">Downloads</text>
          <g fill="#f97316" opacity="0.85">
            <rect x="12" y="38" width="10" height="9" rx="1.5"/>
            <rect x="12" y="58" width="10" height="9" rx="1.5" opacity="0.6"/>
            <rect x="12" y="78" width="9" height="10" rx="1.5" opacity="0.4"/>
          </g>
          <g fill="#6f655d">
            <rect x="30" y="40" width="80" height="5" rx="2.5"/>
            <rect x="30" y="60" width="104" height="5" rx="2.5"/>
            <rect x="30" y="80" width="64" height="5" rx="2.5"/>
          </g>
        </g>
        <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
          values="745 84;745 84;745 84;1015 118;1015 118;1015 118" keyTimes="0;0.5;0.58;0.84;0.95;1"/>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
          values="0;0;1;1;0;0" keyTimes="0;0.5;0.58;0.88;0.95;1"/>
      </g>
    </g>

    <!-- Motion trail under the tear-off -->
    <g class="motion" opacity="0">
      <path d="M800 104 C 870 110, 950 118, 1030 140" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;0.8;0.8;0;0" keyTimes="0;0.5;0.6;0.82;0.9;1"/>
    </g>
  </g>
</svg>
